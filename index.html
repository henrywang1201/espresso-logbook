<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>espresso-logbook · 意式冲煮记录</title>
    <meta name="description" content="意式浓缩冲煮记录 — 拨盘录参、萃取计时、配方小抄、历史与豆子库。" />

    <!-- PWA / theming -->
    <!-- theme-color matches the app's top surface so the iOS/Android status bar
         (and the area behind the notch / Dynamic Island) blends flush. -->
    <meta name="theme-color" content="#f1e8da" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" keeps dark status-bar glyphs (readable on the light cream app). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="espresso" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- fonts: serif headings · sans UI · mono numerals -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    />

    <style>
      /* Cream base so the safe-area / status-bar region never shows a mismatched
         strip on notch / Dynamic Island phones in standalone mode. */
      html, body { margin: 0; padding: 0; height: 100%; background: #f1e8da; overflow: hidden; }
      body { background: #f1e8da; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
